<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-6eKXKehJEVa+SKpEqmOlUipVzKUfKdxK4eVdE9A7d3B3H9BqLQ/0TDW1yq8KRurVtG8Eyg4K+eY1eCHzI2ihLw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        const resultDiv = document.querySelector("#result");

        form.onsubmit = async (e) => {
          e.preventDefault();
          const code = document
            .querySelector("#currency")
            .value.trim()
            .toUpperCase();
          const conversionType = document.querySelector(
            'input[name="conversion"]:checked'
          ).value;

          if (!code) {
            resultDiv.innerHTML =
              '<p class="text-red-500"><i class="fa fa-exclamation-triangle mr-2"></i>Please enter a valid currency code.</p>';
            return;
          }

          try {
            const res = await fetch("https://open.er-api.com/v6/latest/USD");
            const data = await res.json();

            if (data.result === "success" && data.rates[code]) {
              let message;
              if (conversionType === "toUSD") {
                const rate = 1 / data.rates[code];
                message = `<i class="fa fa-money-bill-wave mr-2 text-green-600"></i>1 ${code} = <strong>${rate.toFixed(
                  3
                )}</strong> USD`;
              } else {
                const rate = data.rates[code];
                message = `<i class="fa fa-dollar-sign mr-2 text-green-600"></i>1 USD = <strong>${rate.toFixed(
                  3
                )}</strong> ${code}`;
              }
              resultDiv.innerHTML = `<p class="text-green-600">${message}</p>`;
            } else {
              resultDiv.innerHTML =
                '<p class="text-red-500"><i class="fa fa-times-circle mr-2"></i>Invalid currency code.</p>';
            }
          } catch {
            resultDiv.innerHTML =
              '<p class="text-red-500"><i class="fa fa-wifi-slash mr-2"></i>Unable to connect to API.</p>';
          }
        };
      });
    </script>
  </head>

  <body
    class="bg-gradient-to-br from-blue-50 to-purple-100 min-h-screen flex flex-col"
  >
    <!-- Header -->
    <header class="bg-white shadow">
      <div class="max-w-4xl mx-auto px-6 py-6 text-center">
        <h1 class="text-4xl font-bold text-blue-700">
          <i class="fa fa-exchange-alt mr-2"></i>Currency Converter
        </h1>
        <p class="text-gray-600 mt-1">
          <i class="fa fa-globe mr-1"></i>Live USD conversions
        </p>
      </div>
    </header>

    <!-- Main -->
    <main class="flex-grow grid place-items-center px-4 py-10">
      <div
        class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-lg space-y-6 animate-fade-in"
      >
        <form class="space-y-6">
          <!-- Input -->
          <div>
            <label
              for="currency"
              class="block text-sm font-semibold text-gray-700 mb-1"
            >
              <i class="fa fa-coins text-blue-600 mr-1"></i>Currency Code
            </label>
            <div class="relative">
              <input
                id="currency"
                type="text"
                required
                placeholder="e.g. EUR, GBP, JPY"
                class="pl-10 pr-4 py-3 w-full border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
              <i class="fa fa-search absolute left-3 top-3.5 text-gray-400"></i>
            </div>
          </div>

          <!-- Radio buttons -->
          <fieldset class="space-y-3">
            <legend class="text-sm font-semibold text-gray-700">
              <i class="fa fa-random text-blue-600 mr-1"></i>Conversion Type
            </legend>
            <div class="flex items-center space-x-3">
              <input
                type="radio"
                id="toUSD"
                name="conversion"
                value="toUSD"
                class="accent-blue-600"
                checked
              />
              <label for="toUSD" class="text-gray-700"
                ><i class="fa fa-arrow-down mr-1 text-blue-500"></i>Convert to
                USD</label
              >
            </div>
            <div class="flex items-center space-x-3">
              <input
                type="radio"
                id="fromUSD"
                name="conversion"
                value="fromUSD"
                class="accent-blue-600"
              />
              <label for="fromUSD" class="text-gray-700"
                ><i class="fa fa-arrow-up mr-1 text-blue-500"></i>Convert USD to
                Selected Currency</label
              >
            </div>
          </fieldset>

          <!-- Submit button -->
          <button
            type="submit"
            class="w-full flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl transition"
          >
            <i class="fa fa-exchange-alt mr-2"></i>Convert
          </button>
        </form>

        <!-- Result -->
        <div id="result" class="text-center text-lg font-medium mt-4"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-sm text-center p-4">
      <i class="fa fa-copyright"></i> 2025 Currency Converter. All rights
      reserved.
    </footer>

    <!-- Custom Animation -->
    <style>
      @keyframes fade-in {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out;
      }
    </style>
  </body>
</html>
